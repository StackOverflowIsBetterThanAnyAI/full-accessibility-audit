<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Static contrast</title>
        <style>
            body {
                color: #000;
                background: #fff;
            }
            #low-contrast-link,
            #low-contrast-link:hover,
            #low-contrast-link:focus {
                color: #ddd;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Static contrast</h1>
            <p>
                <a id="low-contrast-link" href="/clean.html"
                    >Always unreadable</a
                >
            </p>
        </main>
    </body>
</html>
