name: Regression Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "create a new benchmark/baseline.json as artifact instead of comparing"
        type: boolean
        default: false

jobs:
  Crawler_Tests:
    name: Crawler Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Crawler Tests
        run: npm run test:crawler

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crawler-tests-screenshots
          path: crawler-tests/screenshots/

  ACT_Benchmark:
    name: W3C ACT Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Download W3C ACT Test Cases
        run: npm run benchmark:fetch

      - name: Run Benchmark
        run: npm run benchmark || true

      - name: Compare With Baseline
        if: ${{ !inputs.update_baseline }}
        run: npm run benchmark:compare

      - name: Create Baseline
        if: ${{ inputs.update_baseline }}
        run: npm run benchmark:update-baseline

      - name: Upload Baseline
        uses: actions/upload-artifact@v4
        if: ${{ inputs.update_baseline }}
        with:
          name: act-benchmark-baseline
          path: benchmark/baseline.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-benchmark-results
          path: benchmark/results/
