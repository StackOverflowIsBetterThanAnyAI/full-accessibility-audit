<text x="400" y="1020" font-size="13" font-weight="600" fill="#f0f6fc">Every finding contains</text>
<text x="400" y="1040" font-size="12" fill="#9198a1">· page, WCAG criterion and severity</text>
<text x="400" y="1058" font-size="12" fill="#9198a1">· the element as HTML and its exact DOM position</text>
<text x="400" y="1076" font-size="12" fill="#9198a1">· how to fix it and a link to the rule</text>
<text x="400" y="1094" font-size="12" fill="#9198a1">· all environments where it was found</text>
<rect x="24" y="1146" width="380" height="44" rx="8" fill="#151b23" stroke="#f85149" stroke-width="1.5"/>
<text x="214" y="1173" text-anchor="middle" font-size="13" font-weight="600" fill="#f85149">✕  Issues found: the workflow fails</text>
<rect x="416" y="1146" width="380" height="44" rx="8" fill="#151b23" stroke="#3fb950" stroke-width="1.5"/>
<text x="606" y="1173" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">✓  No issues: the workflow passes</text>
