<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Clean page</title>
        <style>
            body {
                color: #000;
                background: #fff;
            }
            a {
                color: #0645ad;
            }
            a:hover,
            a:focus {
                color: #000;
            }
        </style>
    </head>
    <body>
        <header>
            <nav aria-label="Main">
                <a href="/clean.html">Home of the clean page</a>
            </nav>
        </header>
        <main>
            <h1>Clean page</h1>
            <p>
                This page is written in English and contains no accessibility
                issues, therefore the audit must not report anything at all.
            </p>
            <form>
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                />
                <button type="submit">Sign in</button>
            </form>
        </main>
    </body>
</html>
