name: Full Accessibility Audit

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "24"
        description: "node.js version to use"

      app_port:
        required: true
        type: string
        description: "provide the correct port for your local server"

      base_path:
        required: false
        type: string
        default: ""
        description: "optional base path appended to localhost"

      start_command:
        required: true
        type: string
        description: "provide the command to start your local server with the correct port and host flags"

      skip_crawler:
        required: false
        type: boolean
        default: false
        description: "skip crawler and run audit directly"

      config_file:
        required: false
        type: string
        default: "sitemap.json"
        description: "name of the json config file in ./cypress/fixtures/"

      image_tag:
        required: false
        type: string
        default: "latest"
        description: "tag of the audit image, e.g. a version like 1.2.0 or sha-<commit>"

    secrets:
      audit_env:
        required: false
        description: "KEY=VALUE lines with the values for {{env.KEY}} placeholders in the state of the config file"

jobs:
  Full_Accessibility_Audit:
    name: Full Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Client-App
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Start App
        run: |
          npm ci
          ${{ inputs.start_command }} &
          npx wait-on http://localhost:${{ inputs.app_port }}${{ inputs.base_path }} --timeout 60000

      - name: Run Full Accessibility Audit via GHCR Image
        env:
          AUDIT_ENV: ${{ secrets.audit_env }}
        run: |
          mkdir -p audit
          mkdir -p cypress/screenshots

          if [ -f "cypress/fixtures/${{ inputs.config_file }}" ]; then
            cp "cypress/fixtures/${{ inputs.config_file }}" audit/sitemap.json
          else
            echo '{"config": {"only": [], "included": [], "excluded": []}, "urls": [], "state": null}' > audit/sitemap.json
          fi

          # the secrets are passed as environment variables and never written into the mounted folders
          AUDIT_ENV_FILE="$RUNNER_TEMP/audit.env"
          printf '%s\n' "$AUDIT_ENV" | tr -d '\r' > "$AUDIT_ENV_FILE"

          GATEWAY_IP=$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')

          if [ "${{ inputs.skip_crawler }}" = "true" ]; then
            AUDIT_COMMAND="npm run cy:run-audit"
          else
            AUDIT_COMMAND="npm run cy:run-crawler && npm run cy:run-audit"
          fi

          BASE_URL="http://$GATEWAY_IP:${{ inputs.app_port }}${{ inputs.base_path }}"

          docker run --rm \
            --ipc=host \
            --env-file "$AUDIT_ENV_FILE" \
            -e CYPRESS_BASE_URL="$BASE_URL" \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/audit:/app/cypress/fixtures \
            -v ${{ github.workspace }}/cypress/screenshots:/app/cypress/screenshots \
            ghcr.io/stackoverflowisbetterthananyai/full-accessibility-audit:${{ inputs.image_tag }} \
            sh -c "
              npx wait-on $BASE_URL --timeout 60000 && \
              $AUDIT_COMMAND
            "

      - name: Upload Audit
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-accessibility-audit
          path: |
            audit/
            cypress/screenshots/
