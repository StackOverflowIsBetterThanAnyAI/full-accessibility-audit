<text x="88" y="1022" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#f0f6fc">full-accessibility-audit.json</text>
<text x="88" y="1045" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#f0f6fc">full-accessibility-audit.md</text>
<text x="88" y="1068" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#f0f6fc">sitemap.json</text>
<text x="88" y="1091" font-size="12" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#f0f6fc">screenshots/</text>
